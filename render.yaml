services:
  - type: web
    name: api-produtos-mobile
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    buildFilter:
      ignoredPaths:
        - client/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
